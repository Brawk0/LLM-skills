display_name: RU Official Documents
short_description: Рекомендательные письма, характеристики, отзывы и заявления для вуза: по образцу, без выдуманных наблюдений и без претензий к третьим лицам.
default_prompt: |
  Подготовь или проверь официальный документ по навыку ru-official-documents:
  воспроизведи структуру и обороты предоставленного образца (включая наличие
  или отсутствие адресата, финальную формулу и вид подписи), опирайся только
  на факты, подтверждённые документами, и на стандартные оценочные формулы
  жанра. Убери выдуманные наблюдения за человеком и любые формулировки,
  читаемые как претензия к третьим лицам. Перечисли факты, которые
  подписанту нужно проверить перед подписью.
