display_name: ONIIP Publications (РФИВ)
short_description: Тезисы для конференции ОНИИП «Радиофизика, фотоника и исследование свойств вещества»: Cambria, двуязычный блок, и запрет формул, таблиц, аббревиатур и ссылок.
default_prompt: |
  Подготовь или проверь тезисы по навыку oniip-publications: сначала прогони
  текст по списку запретов конференции (формулы, таблицы, аббревиатуры,
  сноски, примечания, ссылки на литературу и список литературы не
  допускаются), затем собери документ из официального шаблона в assets/ —
  A4, поля 2 см, Cambria, одинарный интервал, красная строка 1 см,
  русский и английский блоки с «Для цитирования» и «For citation».
  Отрендерь готовый файл в изображения и просмотри страницы перед выдачей.
